name: cociname_app
description: "Prototipo funcional de CocinaME para validar casos de uso principales del negocio."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  tflite_flutter: ^0.11.0
  image: ^4.2.0
  geolocator: ^13.0.2
  geolocator_linux: ^0.2.4
  geocoding: ^4.0.0
  permission_handler: ^11.3.1
  provider: ^6.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/models/food_classifier.tflite
    - assets/models/food_classifier_labels.txt

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/icon/icon.png"
